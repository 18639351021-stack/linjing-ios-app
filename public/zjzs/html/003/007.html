  <H4 align="center">  重晶石粉密度测定简便方法计算  </H4>
<hr class="hr0"> 
                  准备好干燥洁净的重晶石粉大于1000g、校正准确的钻井液密度计(量程2.5g/cm<sup>3</sup >)一套，带刻度玻璃量筒500ml一个，天平一台，搪瓷杯500ml一个。将洁净的淡水用量筒量取250ml，用天平称取洁净干燥的重晶石粉800克，在搅拌状态下将800克重晶石粉倒倾入500ml的搪瓷杯中，搅拌5min，用钻井液密度计分别测定重晶石悬浮液的上部和下部的密度值。
