  <H4 align="center" >  岩屑密度测定方法  </H4>
  <HR>
          准备好干燥洁净的岩屑约大于300g，校正准确的钻井液密度秤一套，将洁净干燥的岩屑（约等于140g）倒入密度秤的浆杯中，使其加盖后称得的密度为1.0g/cm<sup>3</sup>，然后加洁净的淡水充满浆杯。加浆杯盖后擦干仪器称得密度值进行计算。误差为±0.05～0.1g/cm<sup>3</sup>。
