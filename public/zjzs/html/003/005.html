  <H4 align="center">  重晶石粉密度计算  </H4>
<hr class="hr0"> 
                准备好干燥洁净的重晶石粉大于300g、校正准确的钻井液密度秤一套，将洁净干燥的重晶石粉（约等于140g）倒入密度秤的浆杯中，使其加盖后称得的密度为g/cm<sup>3</sup >，然后加入洁净的淡水半杯，用细玻璃棒或金属棒充分搅拌排出气泡，再用洁净的淡水充满浆杯，静止1～2分钟，加浆杯盖后，将溢出液体用洁净的抹布擦干仪器，测量其密度，用该测量值进行计算既得重晶石粉的相对密度。误差为±0.01～0.03g/cm<sup>3</sup >		
。 <hr   style="width:100%;" >
