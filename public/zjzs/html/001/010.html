    function p(i) {
        return Math.floor(i / 10) + "" + i % 10;
    }

        var s = date.getFullYear()+ "-"+p(date.getMonth() + 1) +"-"  + p(date.getDate()); 
        var stime = p(date.getHours()) + ":" + p(date.getMinutes()) + ":" + p(date.getSeconds());
        if (form.dateInputStart.value == "")
            form.dateInputStart.value = s;
        if (form.timeStart.value == "")
            form.timeStart.value = stime;
        if (form.dateInputEnd.value == "")
            form.dateInputEnd.value = s;
        if (form.timeEnd.value == "")
            form.timeEnd.value = stime;
    }

</script>

<script language="javascript" type="text/javascript">
   

    function trunc(i) {
        var j = Math.round(i * 100);
        return Math.floor(j / 100) + (j % 100 > 0 ? "." + p(j % 100) : "");
    }

    function calculate() {

        var temp = $('#dateInputStart').val() + " " + formmain.timeStart.value;
        temp = temp.replace("-", "/");//费力把茶的，JavaScript日期时间格式竟然不支持中文习惯，看来啥都是人家的。
        temp = temp.replace("-", "/");
        var date1 =new Date(temp);
        temp=$('#dateInputEnd').val() + " " + formmain.timeEnd.value;
        temp = temp.replace("-", "/");
        temp = temp.replace("-", "/");
        var date2 =new Date( temp);



      
        var sec = date2.getTime() - date1.getTime();

        if (isNaN(sec)) {
            alert("输入日期或时间的格式不正确，请进行检查，重新修改输入!");
            return;
        }

        if (sec < 0)//如果先后顺序输入错误，交换减数与被减数
           {
               sec = date1.getTime() - date2.getTime();
            
            }

        var second = 1000, minute = 60 * second, hour = 60 * minute, day = 24 * hour;

        formmain.result_h.value = trunc(sec / hour);
         formmain.result_ty.value =( sec / (hour*720)).toFixed(3);
               formmain.result_ts.value =trunc( sec / (hour*24));
        formmain.result_m.value = trunc(sec / minute);
        formmain.result_s.value = trunc(sec / second);

        var days = Math.floor(sec / day);
        sec -= days * day;
        var hours = Math.floor(sec / hour);
        sec -= hours * hour;
        var minutes = Math.floor(sec / minute);
        sec -= minutes * minute;
        var seconds = Math.floor(sec / second);
        formmain.result.value = days + " 天" + (days != 1 ? "" : "") + ", " + hours + " 小时" + (hours != 1 ? "" : "") + ", " + minutes + " 分" + (minutes != 1 ? "" : "") + ", " + seconds + " 秒" + (seconds != 1 ? "" : "");
    }
</script>
