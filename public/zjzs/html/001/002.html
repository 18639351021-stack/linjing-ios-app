      <h3  align="center">套管（钻杆）重力计算</h3> <hr class="hr0"> <form name="form1">



   <div class="ui-block-a"  style="width:62%;"  id="q2" >
套管（钻杆）总长(m):
</div> <div class="ui-block-b"  style="width:35%;"   >
<input type="number"  VALUE="3254"    name="H1" autofocus="autofocus" data-clear-btn="true"   >
 </div> <hr style="width:100%;" >
    <div class="ui-block-a"  style="width:62%;"  id="q2" >
套管（钻杆）外径（mm）:
</div> <div class="ui-block-b"  style="width:35%;"   >
<input type="number"  VALUE="244.5"  name="H2" data-clear-btn="true"   >
 </div> <hr style="width:100%;" >
  <div class="ui-block-a"  style="width:62%;"  id="q2" >

 <div class="ui-block-a"  style="width:62%;"  id="q2" >

 </div> <hr style="width:100%;" >
    <div class="ui-block-a"  style="width:62%;"  id="q2" >

</div> <div class="ui-block-b"  style="width:35%;"   >

 <div class="ui-block-a"  style="width:62%;"  id="q2" >
需要运输车辆（台）:

        说明：</p>1、本计算软件公式为套管总重=套管总长×（套管外径-壁厚）×壁厚×0.02466×浮力系数。</p>
        2、本软件中浮力系数取1、浮力系数=1-钻井液密度/7.8。</p>
