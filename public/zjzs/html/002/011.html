    雷诺系数简称雷诺数，又称雷诺准数，用Re或Nre表示，是用来比较流体流动状态的一个无因次准数，来源于流体力学，最先由英国人雷诺(O.Reynolds)提出。雷诺数为流体惰性力和粘滞力之比。在几何形状相似的流动系统中，只要雷诺数相同流体的流体就相似。
